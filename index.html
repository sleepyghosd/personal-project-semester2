<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Compare Steam game statistics and Google Trends data for multiple games.">
    <title>Game Trends Analyzer</title>
    <link rel="stylesheet" href="/static/styles.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <header>
        <div class="container">
            <h1>Game Trends Analyzer</h1>
        </div>
    </header>
    
    <main class="container">
        <section class="input-section">
            <div class="input-group">
                <input id="appIdInput" placeholder="Enter Game Names (e.g., Counter-Strike: Global Offensive, Dota 2)">
                <button onclick="fetchGameStats()">Analyze Games</button>
            </div>
        </section>
        
        <p id="loadingMessage" style="display:none;"> Analyzing data...</p>

        <div class="dashboard-tabs" id="dashboardTabs"></div>

        <section class="charts-grid">
            <div class="chart-container">
                <div class="chart-header">
                    <div class="chart-title">all sales</div>
                    <button class="chart-close-btn">×</button>
                </div>
                <div class="chart-wrapper">
                    <canvas id="statsChart"></canvas>
                </div>
            </div>
            <div class="chart-container">
                <div class="chart-header">
                    <div class="chart-title">trends on google</div>
                    <button class="chart-close-btn">×</button>
                </div>
                <div class="chart-wrapper">
                    <canvas id="trendChart"></canvas>
                </div>
            </div>
            <div class="chart-container">
                <div class="chart-header">
                    <div class="chart-title">total players ad the time</div>
                    <button class="chart-close-btn">×</button>
                </div>
                <div class="chart-wrapper">
                    <canvas id="playersChart"></canvas>
                </div>
            </div>
            <div class="game-info-container" id="gameInfoContainer"></div>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2026 Game Trends Analyzer. Built for data-driven gaming insights.</p>
        </div>
    </footer>

    <script src="/static/script.js"></script>
</body>
</html>
